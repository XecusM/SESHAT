{% load i18n %}
{% if request.user.is_authenticated %}
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" method="post" action="">
      {% csrf_token %}
      <div class="modal-header border-0 pb-0">
        <h2 class="modal-title fs-5" id="deleteModalLabel">
          <i class="fa-solid fa-trash-can text-danger me-2"></i>{% trans 'Delete' %}
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% trans 'Close' %}"></button>
      </div>
      <div class="modal-body">
        <p class="mb-1">{% trans 'Are you sure you want to delete' %} <strong data-delete-name></strong>?</p>
        <p class="text-muted small mb-0">{% trans 'This action cannot be undone.' %}</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">{% trans 'Cancel' %}</button>
        <button type="submit" class="btn btn-danger">{% trans 'Delete' %}</button>
      </div>
    </form>
  </div>
</div>
{% endif %}
