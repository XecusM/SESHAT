{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
{% get_language_info_list for LANGUAGES as languages %}
<div class="dropdown">
  <button class="sh-icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="{% trans 'Language' %}" title="{% trans 'Language' %}">
    <i class="fa-solid fa-language"></i>
  </button>
  <ul class="dropdown-menu dropdown-menu-end">
    {% for language in languages %}
    <li>
      <form action="{% url 'set_language' %}" method="post" class="m-0">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <input name="language" type="hidden" value="{{ language.code }}">
        <button type="submit" class="dropdown-item{% if language.code == LANGUAGE_CODE %} active{% endif %}" lang="{{ language.code }}">
          {{ language.name_local }}
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
</div>
