{% extends 'base_.html' %}
{% load i18n %}
{% block title %}{% trans 'Password changed' %} | {% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card text-center">
      <div class="card-body p-5">
        <div class="stat-card mb-3"><span class="stat-icon"><i class="fa-solid fa-circle-check"></i></span></div>
        <h1 class="h4">{% trans 'Your password has been changed' %}</h1>
        <p class="text-muted">{% trans 'Use your new password the next time you log in.' %}</p>
        <a class="btn btn-primary" href="{% url 'account:UserDetails' pk=request.user.id %}">{% trans 'Back to my account' %}</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
