{% load i18n %}
<div class="row g-2 align-items-end mb-3">
  <div class="col-6 col-md-3">
    <label class="form-label small mb-1" for="reportFromDate">{% trans 'From' %}</label>
    <input type="date" class="form-control" id="reportFromDate" value="{{ default_from_date|date:'Y-m-d' }}">
  </div>
  <div class="col-6 col-md-3">
    <label class="form-label small mb-1" for="reportToDate">{% trans 'To' %}</label>
    <input type="date" class="form-control" id="reportToDate" value="{{ default_to_date|date:'Y-m-d' }}">
  </div>
  <div class="col-md-2">
    <button type="button" class="btn btn-outline-primary w-100" id="reportApply">{% trans 'Apply' %}</button>
  </div>
</div>
<div class="row g-3 mb-3" id="reportMetrics"></div>
<div class="card mb-3">
  <div class="card-header">{% trans 'Activities per month' %}</div>
  <div class="card-body"><div class="chart-box"><canvas id="totalChart"></canvas></div></div>
</div>
<div class="card mb-3">
  <div class="card-header">{% trans 'By activity type' %}</div>
  <div class="card-body"><div class="chart-box" style="height: 320px;"><canvas id="typeChart"></canvas></div></div>
</div>
<div class="row g-3">
  <div class="{% if show_users %}col-md-6{% else %}col-12{% endif %}">
    <div class="card h-100">
      <div class="card-header">{% trans 'Activity by area' %}</div>
      <div class="card-body"><div class="chart-box" style="height: 260px;"><canvas id="areaChart"></canvas></div></div>
    </div>
  </div>
  {% if show_users %}
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-header">{% trans 'Top active users' %}</div>
      <div class="card-body"><div class="chart-box" style="height: 260px;"><canvas id="topUsersChart"></canvas></div></div>
    </div>
  </div>
  {% endif %}
</div>
<script id="report-labels" type="application/json">
  {"total": "{% trans 'Total activities' %}", "common": "{% trans 'Most common' %}", "area": "{% trans 'Most active area' %}", "user": "{% trans 'Most active user' %}", "activities": "{% trans 'Activities' %}"}
</script>
