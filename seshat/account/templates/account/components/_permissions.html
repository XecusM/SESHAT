{% load i18n %}
<div class="row g-3">
  {% for group in permissions %}
  <div class="col-md-6 col-xl-4">
    <div class="card h-100">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>{{ group.label }}</span>
        {% if editable %}
        <button type="button" class="btn btn-sm btn-link p-0" data-check-group="{{ group.title }}">{% trans 'Select all' %}</button>
        {% endif %}
      </div>
      <div class="card-body">
        {% for name, label in group.permissions %}
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="permissions" value="{{ name }}" id="perm-{{ name|slugify }}" data-group="{{ group.title }}"
            {% if name in user_permissions %}checked{% endif %} {% if not editable %}disabled{% endif %}>
          <label class="form-check-label" for="perm-{{ name|slugify }}">{{ label }}</label>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% if editable %}
<script>
  document.querySelectorAll('[data-check-group]').forEach(function (button) {
    button.addEventListener('click', function () {
      var boxes = document.querySelectorAll('[data-group="' + button.getAttribute('data-check-group') + '"]');
      var check = Array.prototype.some.call(boxes, function (box) { return !box.checked; });
      boxes.forEach(function (box) { box.checked = check; });
    });
  });
</script>
{% endif %}
