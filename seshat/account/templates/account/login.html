{% extends 'base_.html' %}
{% load static i18n crispy_forms_tags %}
{% block title %}{% trans 'Login' %} | {% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <img class="logo mb-3" src="{% static 'images/logo.png' %}" alt="SESHAT" data-logo-light>
        <h1 class="h4 mb-1">{% trans 'Welcome back' %}</h1>
        <p class="text-muted mb-0">{% trans 'Sign in to manage your stock.' %}</p>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100 mt-2"><i class="fa-solid fa-right-to-bracket me-1"></i>{% trans 'Login' %}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
  if (document.documentElement.getAttribute('data-bs-theme') === 'dark') {
    document.querySelector('[data-logo-light]').src = "{% static 'images/logo-dark.png' %}";
  }
</script>
{% endblock %}
